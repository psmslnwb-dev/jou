<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조우직업재활시설</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; color: #2d3748; line-height: 1.7; background-color: #fafaf7; }
        
        header { background: #ffffff; border-bottom: 1px solid #e8f5e9; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 22px 30px; }
        .logo { font-size: 24px; font-weight: 800; color: #2e7d32; text-decoration: none; }
        
        .nav-menu { display: flex; list-style: none; gap: 40px; }
        .nav-menu > li > a { text-decoration: none; color: #2d3748; font-weight: 700; font-size: 16px; }
        .nav-menu > li > a:hover { color: #2e7d32; }

        /* 메인 배너: CI의 초록 나무를 연상시키는 따뜻한 톤 */
        .hero { 
            background: linear-gradient(135deg, rgba(46, 125, 50, 0.9), rgba(76, 175, 80, 0.8)), 
            url('https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover; 
            height: 500px; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; 
        }
        .hero h1 { font-size: 44px; font-weight: 800; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .hero p { font-size: 20px; font-weight: 400; opacity: 0.95; }

        .container { max-width: 1200px; margin: 80px auto; padding: 0 30px; }
        .section-title { text-align: center; font-size: 32px; color: #1b4332; margin-bottom: 60px; font-weight: 800; }
        
        /* 카드 디자인: 부드러운 초록 그림자 */
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .card { 
            background: #ffffff; padding: 40px 30px; border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(46,125,50,0.08); 
            border: 1px solid #e8f5e9; text-align: center; transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); border-color: #a5d6a7; }
        .card h3 { font-size: 22px; color: #2e7d32; margin-bottom: 15px; }
        .card p { font-size: 15px; color: #555; line-height: 1.6; }

        footer { background: #1b4332; color: #a3b18b; text-align: center; padding: 50px 0; margin-top: 100px; }
        .footer-logo { color: #fff; font-weight: 700; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">조우직업재활시설</a>
            <ul class="nav-menu">
                <li><a href="#">법인소개</a></li>
                <li><a href="#">시설소개</a></li>
                <li><a href="#">소통공간</a></li>
            </ul>
        </div>
    </header>

    <div class="hero">
        <div>
            <h1>마음과 마음이 만나, 함께 날아오르다</h1>
            <p>조우직업재활시설은 따뜻한 나눔의 가치를 실천합니다.</p>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">주요 서비스</h2>
        <div class="card-grid">
            <div class="card">
                <h3>법인소개</h3>
                <p>꿈과 희망을 연결하는 블루링크사회적협동조합의 비전과 철학을 소개합니다.</p>
            </div>
            <div class="card">
                <h3>직업 재활</h3>
                <p>개개인의 능력을 존중하며, 자립을 위한 맞춤형 직업 훈련을 제공합니다.</p>
            </div>
            <div class="card">
                <h3>소통 공간</h3>
                <p>시설의 일상과 소식을 나누며 함께 성장하는 행복한 커뮤니티입니다.</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-logo">조우직업재활시설</div>
        <p>Copyright © 조우직업재활시설 All rights reserved.</p>
    </footer>

</body>
</html>
