<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시설 조직도 - 조우직업재활시설</title>
    <style>
        /* =========================
           공통 및 헤더/푸터 스타일 (최신버전)
        ========================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; color: #333; background: #ffffff; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* =========================
           상단 헤더
        ========================= */
        header { width: 100%; background: rgba(255, 255, 255, 0.97); border-bottom: 1px solid #e8eee8; position: sticky; top: 0; z-index: 1000; }
        .header-inner { max-width: 1200px; height: 90px; margin: 0 auto; padding: 0 25px; display: flex; align-items: center; justify-content: space-between; }

        /* =========================
           로고 (네온 & 움직임 효과 추가된 최신버전)
        ========================= */
        .logo { display: flex; align-items: center; gap: 15px; min-width: 250px; transition: transform 0.3s ease; }
        .logo:hover { transform: scale(1.03); }
        .logo img { 
            width: 70px; height: 70px; object-fit: contain; 
            animation: floatLogo 3s ease-in-out infinite; 
        }
        .logo-text { display: flex; flex-direction: column; justify-content: center; }
        .logo-title { 
            font-size: 24px; font-weight: 800; color: #426b38; letter-spacing: -1.5px; 
            animation: neonGlow 2.5s ease-in-out infinite alternate; 
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes neonGlow {
            0% { text-shadow: 0 0 2px rgba(120, 169, 79, 0.1), 0 0 5px rgba(120, 169, 79, 0.1); }
            100% { text-shadow: 0 0 5px rgba(124, 179, 66, 0.5), 0 0 12px rgba(124, 179, 66, 0.3), 0 0 20px rgba(124, 179, 66, 0.2); }
        }

        /* =========================
           메인 메뉴
        ========================= */
        .main-menu { height: 100%; display: flex; align-items: center; gap: 15px; }
        .main-menu > li { position: relative; height: 100%; display: flex; align-items: center; }
        .main-menu > li > a { 
            padding: 10px 24px; display: flex; align-items: center; font-size: 16px; font-weight: 700; color: #444; 
            background: #ffffff; border: 2px solid #e4ece0; border-radius: 30px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), inset 0 -2px 0 rgba(0, 0, 0, 0.05); transition: 0.25s; 
        }
        .main-menu > li:hover > a { 
            background: #5d914d; border-color: #5d914d; color: #ffffff; 
            box-shadow: 0 6px 15px rgba(93, 145, 77, 0.3); transform: translateY(-2px); 
        }

        /* 드롭다운 메뉴 */
        .submenu { 
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%) translateY(10px); width: 190px; 
            background: #ffffff; border: 1px solid #e4ebe4; border-radius: 0 0 10px 10px; padding: 12px 0; 
            opacity: 0; visibility: hidden; transition: 0.25s; box-shadow: 0 12px 30px rgba(49, 83, 45, 0.10); 
        }
        .main-menu > li:hover .submenu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .submenu li a { display: block; padding: 10px 20px; font-size: 14px; color: #555; transition: 0.2s; }
        .submenu li a:hover { background: #f1f7ef; color: #4d873e; }

        /* 서브페이지 공통 레이아웃 */
        .content-page { max-width: 1200px; margin: 50px auto; padding: 0 25px; min-height: 600px; }
        .page-title { font-size: 28px; color: #3b6033; margin-bottom: 40px; text-align: center; font-weight: 700; border-bottom: 2px solid #5d914d; padding-bottom: 15px; display: inline-block; left: 50%; position: relative; transform: translateX(-50%); }
        
        /* 푸터 */
        footer { background: #30482c; color: rgba(255, 255, 255, 0.65); padding: 30px 25px; font-size: 12px; }
        .footer-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }

        @media (max-width: 900px) {
            .header-inner { height: 80px; } .logo { min-width: auto; } .logo img { width: 60px; height: 60px; } .logo-title { font-size: 20px; }
            .main-menu { gap: 6px; } .main-menu > li > a { padding: 6px 14px; font-size: 14px; } .submenu { top: 75px; }
        }
        @media (max-width: 700px) {
            .header-inner { padding: 0 15px; } .main-menu { gap: 4px; } .main-menu > li > a { padding: 5px 10px; font-size: 12px; border-width: 1px; }
            .footer-inner { flex-direction: column; gap: 10px; align-items: center; }
        }

        /* =========================
           조직도 전용 스타일 (마우스 팝업 제거) (기존 유지)
        ========================= */
        .org_wrapper { 
            padding: 20px 0 140px 0; 
            background: #ffffff; 
            text-align: center; 
            position: relative;
            overflow: visible; 
            overflow-x: auto; 
        }

        .org_tree, .org_tree ul, .org_tree li { position: relative; list-style: none; margin: 0; padding: 0; }
        .org_tree { display: inline-block; white-space: nowrap; }

        /* 단계별 상하 간격 */
        .org_tree ul { display: flex; justify-content: center; padding-top: 80px; }
        .org_tree li { padding: 35px 20px 0; }

        /* 연결선 디자인 */
        .org_tree li::before, .org_tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 1px solid #cbd5e1; width: 50%; height: 35px; }
        .org_tree li::after { right: auto; left: 50%; border-left: 1px solid #cbd5e1; }
        .org_tree li:only-child::after, .org_tree li:only-child::before { display: none; }
        .org_tree li:only-child { padding-top: 0; }
        .org_tree li:first-child::before, .org_tree li:last-child::after { border: 0 none; }
        .org_tree li:last-child::before { border-right: 1px solid #cbd5e1; border-radius: 0 5px 0 0; }
        .org_tree li:first-child::after { border-radius: 5px 0 0 0; }

        /* 중앙 수직 연결선 */
        .org_tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 1px solid #cbd5e1; width: 0; height: 80px; margin-left: -1px; }

        /* 노드 박스 디자인 (깔끔하게 고정) */
        .org_node {
            display: inline-block;
            width: 200px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 10;
        }

        .node_pos { display: block; padding: 18px 0; font-size: 16px; font-weight: 700; color: #1e293b; }

        /* 팀별 상단 라인 */
        .top_line { border-top: 5px solid #1e293b; }
        .admin_line { border-top: 5px solid #75a65c; }
        .rehab_line { border-top: 5px solid #5d914d; }
        .production_line { border-top: 5px solid #3c5f34; }

        /* 모바일 최적화 (조직도 안 깨지게 잡아주는 역할) */
        @media (max-width: 768px) {
            .org_wrapper { padding: 20px 10px 100px 10px; }
            .org_tree ul { flex-direction: column; align-items: center; padding-top: 20px; }
            .org_tree li { padding: 15px 0 0 0; width: 100%; }
            .org_node { width: 160px; }
            .org_tree li::before, .org_tree li::after { border: none !important; }
            .org_tree ul ul::before { height: 15px; top: 0; }
        }
    </style>
</head>
